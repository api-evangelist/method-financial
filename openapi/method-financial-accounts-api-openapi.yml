          data:
            type: array
            items:
              $ref: '#/components/schemas/Account'
    AccountLiability:
      type:
      - object
      - 'null'
      description: Liability account details. Present when `type` is `liability`.
      required:
      - mch_id
      - mask
      - ownership
      - fingerprint
      - type
      - sub_type
      - name
      properties:
        mch_id:
          title: AccountLiabilityExpandableMerchant
          description: The merchant ID associated with this liability.
          oneOf:
          - type: string
            pattern: ^mch_\w+$
          - $ref: '#/components/schemas/Merchant'
        mask:
          type:
          - string
          - 'null'
          description: Last 4 digits of the account number.
          example: '4321'
        ownership:
          type:
          - string
          - 'null'
          description: Ownership type of the account.
          enum:
          - primary
          - authorized
          - joint
          - unknown
          - null
        fingerprint:
          type:
          - string
          - 'null'
          description: Unique fingerprint for de-duplication.
        type:
          type: string
          description: The type of liability.
          enum:
          - credit_card
          - auto_loan
          - mortgage
          - personal_loan
          - student_loan
          - student_loans
          - collection
          - credit_builder
          - insurance
          - loan
          - medical
          - utility
          - bnpl
          - fintech
        sub_type:
          type:
          - string
          - 'null'
          description: More specific classification of the liability type.
        name:
          type:
          - string
          - 'null'
          description: Display name of the liability account.
    CreateDebitCardAccountRequest:
      type: object
      description: Create a debit card account.
      required:
      - holder_id
      - debit_card
      properties:
        type:
          type: string
          enum:
          - debit_card
        holder_id:
          type: string
          description: The entity ID that will own this account.
          pattern: ^ent_\w+$
        debit_card:
          type: object
          description: Debit card details.
          required:
          - number
          - exp_month
          - exp_year
          properties:
            number:
              type: string
              minLength: 15
              maxLength: 16
            exp_month:
              type: string
              pattern: ^(0[1-9]|1[0-2])$
            exp_year:
              type: integer
            cvv:
              type: string
            billing_zip_code:
              type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
    CreateClearingAccountRequest:
      type: object
      description: Create a clearing account.
      required:
      - holder_id
      - clearing
      properties:
        type:
          type: string
          enum:
          - clearing
        holder_id:
          type: string
          description: The entity ID that will own this account.
          pattern: ^ent_\w+$
        clearing:
          type: object
          description: Clearing account details.
          required:
          - type
          properties:
            type:
              type: string
              description: The type of clearing account to create.
              enum:
              - single_use
              - multi_use
        metadata:
          $ref: '#/components/schemas/Metadata'
    AccountClearing:
      type:
      - object
      - 'null'
      description: Clearing account details. Present when `type` is `clearing`.
      properties:
        type:
          type: string
          description: The type of clearing account.
          enum:
          - single_use
          - multi_use
        routing:
          type: string
          description: The clearing routing number.
        number:
          type: string
          description: The clearing account number.
    AccountResourceError:
      type:
      - object
      - 'null'
      description: Error details when an account is disabled.
      required:
      - type
      - code
      - sub_type
      - message
      properties:
        type:
          type: string
          description: The category of account error.
          enum:
          - ACCOUNT_DISABLED
        code:
          type: integer
          description: Numeric error code (11XXX range).
          enum:
          - 11001
          - 11002
          - 11003
          - 11004
          - 11005
          - 11006
        sub_type:
          type: string
          description: Specific account error classification.
          enum:
          - ACCOUNT_INVALID_DETAILS
          - ACCOUNT_UNAUTHORIZED_PAYMENT
          - ACCOUNT_CLOSED
          - ACCOUNT_CONSENT_WITHDRAWN
          - ACCOUNT_DISABLED_INVALID_STATE
          - ACCOUNT_DISABLED_HOLDER_ENTITY_DISABLED
        message:
          type: string
          description: Human-readable error description.
      example:
        type: ACCOUNT_DISABLED
        code: 11001
        sub_type: ACCOUNT_INVALID_DETAILS
        message: Account was disabled due to invalid information reported by the financial institution.
    CreateAchAccountRequest:
      type: object
      description: Create an ACH account.
      required:
      - holder_id
      - ach
      properties:
        type:
          type: string
          enum:
          - ach
        holder_id:
          type: string
          description: The entity ID that will own this account.
          pattern: ^ent_\w+$
        ach:
          type: object
          description: ACH account details.
          required:
          - routing
          - number
          - type
          properties:
            routing:
              type: string
              description: The ACH routing number.
              pattern: ^\d{9}$
            number:
              type: string
              description: The ACH account number.
              pattern: ^\d+$
            type:
              type: string
              description: The type of ACH account.
              enum:
              - checking
              - savings
        metadata:
          $ref: '#/components/schemas/Metadata'
    AccountPayoff:
      type: object
      description: A payoff record for an account.
      required:
      - id
      - account_id
      - status
      - amount
      - term
      - per_diem_amount
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the payoff.
          pattern: ^pyf_\w+$
          example: pyf_dKe9ehC3hEBYy
        account_id:
          type: string
          description: The account this payoff belongs to.
          pattern: ^acc_\w+$
        status:
          type: string
          description: Current status of the payoff request.
          enum:
          - completed
          - pending
          - failed
        amount:
          type:
          - number
          - 'null'
          description: The payoff amount in cents.
        term:
          type:
          - number
          - 'null'
          description: Number of days the payoff amount is valid.
        per_diem_amount:
          type:
          - number
          - 'null'
          description: Per diem interest amount in cents.
        error:
          $ref: '#/components/schemas/PayoffResourceError'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the payoff was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the payoff was last updated.

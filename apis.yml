apis:
- aid: method-financial:method-api
  name: Method API
  description: 'The Method API is a single REST interface for consumer liability data
    and payments. Create an Entity for a consumer, verify their identity, run Connect
    to discover every liability they hold, retrieve normalized balances, payoffs, transactions,
    credit scores and attributes, and initiate payments from a funding account to those
    creditors. Authentication is a Bearer secret key (sk_) and the API version is pinned
    with the Method-Version header. Asynchronous results arrive over webhooks.'

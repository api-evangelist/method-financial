aid: method-financial
name: Method Financial
description: 'Method Financial is a US financial connectivity platform that gives developers
  a single REST API for consumer liability data and debt payments. Instead of asking
  a consumer to hand over bank credentials, Method verifies the consumer''s identity
  and runs a permissioned soft credit pull to automatically discover every liability
  they hold — credit cards, auto loans, mortgages, student loans and personal loans
  — across 15,000+ financial institutions. It then normalizes balances, due dates,
  interest rates, payment amounts and limits into one data model, keeps them fresh
  through on-demand Updates and Subscriptions, and moves money directly to those creditors
  through its Payments API. The platform also ships embeddable Opal/Elements UI components,
  credit scores, financial attributes, card-brand enrichment, vehicle enrichment and
  a webhook event stream, and is used for lending origination, debt consolidation,
  portfolio intelligence, commerce card-linking and personal financial management.'

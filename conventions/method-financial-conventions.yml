idempotency:
  supported: true
  header: Idempotency-Key
  key_format: any unique string up to 255 characters; V4 UUID recommended
  scope: all POST requests
  semantics: The status code and body of the first request for a key are saved and replayed on subsequent
    requests with the same key. Transient failures (500, timeout, dropped connection) are automatically
    reconciled so a retry with the same key is reprocessed rather than replaying the error, guaranteeing
    at-most-once execution.
  retention: null
  unavailable_error:
    status: 503
    type: API_ERROR
    sub_type: IDEMPOTENCY_UNAVAILABLE
    guidance: Retry later if idempotency is required, or fall back to non-idempotent processing by omitting
      the header.
  docs: https://docs.methodfi.com/reference/idempotency

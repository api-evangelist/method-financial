gap: Method has the two hardest prerequisites for an API MCP server already in place — a complete first-party
  OpenAPI 3.1.0 with 128 unique operationIds, and a published agent skill describing the flows — but no
  MCP server that exposes them. The highest-leverage next step for Method is a second MCP server, bearer-authenticated
  with a team secret key, that projects the Entity -> Connect -> Account -> Payment operations as tools.

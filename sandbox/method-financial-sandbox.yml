  description: Simulated flows over test data. Mimics real account discovery, payment timelines and error
    states.
  simulations_enabled: false
- name: Production
  base_url: https://production.methodfi.com
  description: 'Live environment: real institutions, real data, real money.'
  simulations_enabled: false
credential_separation:
